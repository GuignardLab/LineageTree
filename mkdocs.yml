site_name: LineageTree documentation
theme:
  name: material
  custom_dir: docs/overrides
  palette:
  - scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  features:
  - navigation.path
  - navigation.expand
  - content.code.annotate
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - pymdownx.superfences   
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:            
          options:
            docstring_style: numpy
            show_source: false
            follow_imports: true
            show_signature_annotations: true
            members_order: source
            heading_level: 2
            filters:
                - "!^__.*__$"     # exclude __dunder__ methods
                - "!^_.*"         # exclude _private methods
extra_css:
  - styles/extra.css

          
nav:
  - Home: index.md
  - Download and Import: getting-started.md
  - Glossary: glossary.md
  - Core Utility: core.md
  - Loaders: loaders.md
  - Visualization: viz.md
  - Analysis:
    - Uted: uted.md
    - Dynamic Time Warping: dtw.md
    - Spatial: spatial.md
  - API Reference: api.md
